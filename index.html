<!doctype html>
<html lang="ru">
  <head>
    <script>
      try {
        const choice = localStorage.getItem('33-recipe-app-theme')
        const dark =
          choice === 'dark' ||
          (choice !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {
        // The React theme provider applies the fallback after mount.
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta
      name="description"
      content="33 RECIPE — персональная студия рецептов"
    />
    <title>33 RECIPE — Personal Recipe Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
